<html lang="es">

  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="frontend/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>

<!-- Menú Superior -->
<nav class="navbar navbar-expand-lg navbar-custom">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-file-earmark-text"></i> Licitaciones MP
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="index.html">
            <i class="bi bi-house-fill"></i> Inicio
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="palabras_clave.html">
            <i class="bi bi-search"></i> Palabras Clave
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="organismos.html">
            <i class="bi bi-buildings"></i> Instituciones Públicas
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="proveedores.html">
            <i class="bi bi-shop"></i> Proveedores
          </a>
        </li>
        <li class="nav-item d-none" id="navGuardadasItem">
          <a class="nav-link" href="guardadas.html">
            <i class="bi bi-bookmark-check"></i> Guardadas
          </a>
        </li>
        <li class="nav-item d-none" id="navAdminItem">
          <a class="nav-link" href="admin_usuarios.html">
            <i class="bi bi-people-fill"></i> Admin Usuarios
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="navAuthLink" href="ingresar.html">
            <i class="bi bi-box-arrow-in-right"></i> Ingresar
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid mt-4">
  <div class="row mb-4">
    <div class="col-md-3 ps-0">
      <h5>Filtros por instituciones frecuentes</h5>
      <div id="filtrosInstituciones" class="form-check"></div>
      <div class="d-flex gap-3 justify-content-start mt-3">
        <button class="btn btn-primary" onclick="seleccionarTodasYFiltrar()">Seleccionar todo</button>
        <button class="btn btn-secondary" onclick="limpiarFiltros()">Limpiar filtros</button>
      </div>
      <hr class="my-3">
      <h6>Filtros por tipo de licitación</h6>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="excluirBajoValor" onchange="filtrarDatos()" style="cursor: pointer;">
        <label class="form-check-label" for="excluirBajoValor" style="cursor: pointer;">
          Excluir L1 y E2 (bajo valor)
        </label>
      </div>
    </div>

    <div class="col-md-9">
      <h2>Licitaciones publicadas</h2>
      <input type="text" id="filtroTexto" class="form-control my-3" placeholder="Filtrar por ID o Institución" oninput="filtrarDatos()">
      <div class="d-flex justify-content-between">
        <div id="cantidadResultados" class="my-3"></div>
        <button class="btn btn-success btn-sm mb-2" onclick="descargarLicitaciones()">Descargar Licitaciones</button>
      </div>
      <div id="contenedorCards"></div>

    <nav>
      <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
    </div>
  </div>
</div>


<script type="text/javascript" src="frontend/visualization.js"></script>
<script src="frontend/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Marcar el enlace activo en el menú
  document.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.nav-link').forEach(link => {
      const href = link.getAttribute('href');
      if (href === currentPage) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });
  });
</script>
</body>
</html>
