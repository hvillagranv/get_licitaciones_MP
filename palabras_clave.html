<div class="container-fluid mt-4">
  <div class="row mb-4">
    <div class="col-md-3 ps-0">
      <h5>Palabras clave</h5>
      <div id="filtrosPalabras" class="suggestion-filter-chip-list filtro-lista-vertical"></div>
      <div class="d-flex gap-2 justify-content-start mt-3">
        <button class="btn btn-primary btn-sm" onclick="seleccionarTodasYFiltrar()">Seleccionar todo</button>
        <button class="btn btn-secondary btn-sm" onclick="limpiarFiltros()">Limpiar</button>
      </div>
    </div>

    <div class="col-md-9">
      <h2>Licitaciones publicadas por palabras clave</h2>
      <div class="row g-2 my-2">
        <div class="col-md-5">
          <input type="text" id="filtroTexto" class="form-control" placeholder="Filtrar por ID, titulo, institucion o descripcion" onkeydown="buscarTextoEnEnter(event)">
        </div>
        <div class="col-md-3">
          <select id="filtroPeriodo" class="form-select" onchange="filtrarDatos()">
            <option value="">Periodo: Todos</option>
            <option value="3m">Últimos 3 meses</option>
            <option value="6m">Últimos 6 meses</option>
            <option value="1y">Último año</option>
            <option value="2y">Últimos 2 años</option>
            <option value="3y">Últimos 3 años</option>
            <option value="5y">Últimos 5 años</option>
            <option value="gt5y">Mayor a 5 años</option>
          </select>
        </div>
        <div class="col-md-4 d-flex align-items-center">
          <div id="resumenPalabras" class="text-muted small"></div>
        </div>
      </div>
      <div class="d-flex justify-content-between">
        <div id="cantidadResultados" class="my-3"></div>
        <div class="d-flex gap-2 align-items-center">
          <button id="btnActualizarListado" class="btn btn-outline-primary btn-sm mb-2" onclick="actualizarListadoManual()">
            <i class="bi bi-arrow-clockwise"></i> Actualizar listado
          </button>
          <button id="btnDescargarCsv" class="btn btn-success btn-sm mb-2" onclick="descargarCsv()" disabled>Descargar CSV</button>
        </div>
      </div>
      <div id="estadoActualizacion" class="small text-muted mb-2"></div>

      <div id="contenedorCards"></div>

      <nav>
        <ul class="pagination justify-content-center" id="pagination"></ul>
      </nav>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="frontend/auth.js"></script>
<script>
  // Marcar el enlace activo en el menú
  document.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.nav-link').forEach(link => {
      const href = link.getAttribute('href');
      if (href === currentPage) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });
  });
</script>
